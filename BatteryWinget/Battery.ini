[Rainmeter]
Author=Nooby4Ever
Upgrader = adarshcsea
AppVersion=2003000
Update=1000

[Metadata]
Name=BatteryWidget
Description=Clean Battery Widget matching Mond skin theme.
License=Creative Commons Attribution-Non-Commercial-Share Alike 3.0
Version=2.0

;------------------------------------Variables----------------------------------------------

[Variables]
@include=#@#\Settings\Variables.inc

; Theme Colors
ColorMond=175,183,188,255
ColorGreen=106,204,101,255

; Active dynamic color (defaults to Mond grey)
CurrentColor=175,183,188,255

;------------------------------------Styles-------------------------------------------------

[styleLabel]
FontColor=175,183,188,255
FontSize=9
FontFace=Trebuchet MS
StringStyle=BOLD
StringEffect=SHADOW
StringAlign=CENTER
AntiAlias=1

;------------------------------------Measurements-------------------------------------------

[mPowerPercent]
Measure=Plugin
Plugin=PowerPlugin
PowerState=PERCENT

; Returns 1 when plugged in (AC), 0 when on battery
[mPowerSource]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLINE

[mPowerRemain]
Measure=Plugin
Plugin=PowerPlugin
PowerState=LIFETIME
Format="%#H:%M Remaining"
Substitute="Unknown":"Calculating...","0:00 Remaining":"Calculating..."
DynamicVariables=1

; Controls color and text visibility based on charging state
[cCheckPowerSource]
Measure=Calc
Formula=[mPowerSource]
DynamicVariables=1
IfCondition=cCheckPowerSource = 1
IfTrueAction=[!SetVariable CurrentColor "#ColorGreen#"][!HideMeter meterBatteryText][!UpdateMeter *][!Redraw]
IfFalseAction=[!SetVariable CurrentColor "#ColorMond#"][!ShowMeter meterBatteryText][!UpdateMeter *][!Redraw]

; Calculates dynamic fill width based on percentage (scale: 0 to 38 px)
[cFillWidth]
Measure=Calc
Formula=Clamp(Round((mPowerPercent / 100) * 38), 0, 38)
DynamicVariables=1

;------------------------------------Meters-------------------------------------------------

; Clean vector battery shell (shifted right to X=55 to give left margin for text)
[meterBatteryFrame]
Meter=Shape
Shape=Rectangle 55,4,44,22,4 | Fill Color 0,0,0,1 | StrokeWidth 2 | Stroke Color #CurrentColor#
Shape2=Rectangle 99,11,3,8,1 | Fill Color #CurrentColor# | StrokeWidth 0
DynamicVariables=1

; Horizontal progress fill inside the shell
[meterBatteryFill]
Meter=Shape
Shape=Rectangle 58,7,[cFillWidth],16,2 | Fill Color #CurrentColor# | StrokeWidth 0
DynamicVariables=1

; Battery percentage centered inside the icon
[meterPercentInside]
Meter=STRING
MeasureName=mPowerPercent
FontFace=Trebuchet MS
FontSize=8
FontColor=10,10,10,255
StringStyle=BOLD
StringAlign=CENTERCENTER
AntiAlias=1
X=77
Y=15
Text=%1%
DynamicVariables=1

; Estimated time remaining (centered below the battery icon with full canvas clearance)
[meterBatteryText]
Meter=STRING
MeasureName=mPowerRemain
MeterStyle=styleLabel
X=78
Y=32
W=156
H=18
Text="%1"
DynamicVariables=1
Hidden=1